[package]
name = "r8s-types"
version.workspace = true
edition.workspace = true
build = "build.rs"

# prost-generated code carries doc comments lifted from the k8s .proto files;
# rustdoc tries to parse them as doctests and fails on the embedded URLs/
# JSON snippets. We have no human-authored doctests in this crate anyway.
[lib]
doctest = false

[dependencies]
k8s-openapi.workspace = true
rustc-hash.workspace = true
serde.workspace = true
serde_json.workspace = true
prost.workspace = true
prost-types.workspace = true
chrono.workspace = true
base64.workspace = true

[build-dependencies]
prost-build.workspace = true
